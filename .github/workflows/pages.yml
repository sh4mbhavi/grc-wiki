# Publishes the static build to GitHub Pages.
#
# The Next.js app is the other renderer of the same content; to publish that
# instead, swap the build step for `make next` and the upload path for
# `next/out`. Do not publish both to the same domain — they are two renderings
# of one site, and duplicate canonicals would compete.
#
# `enablement: true` turns Pages on the first time this runs, so no repo
# setting has to be changed by hand. If the run fails on that step, an admin
# needs Settings -> Pages -> Source: GitHub Actions, once.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r tools/requirements.txt

      # Fail the build on an authoring mistake rather than shipping it.
      - run: python tools/build.py --check

      - run: python tools/build.py

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
