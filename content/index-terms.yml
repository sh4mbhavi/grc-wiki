# The A–Z index (3c).
#
# Headwords, not entry titles. Index convention is the inverted form — "Appetite,
# risk" rather than "Risk appetite" — so related terms cluster alphabetically,
# which also happens to capture both query orders.
#
# `ref` is the clause the headword points at. Where that clause is published the
# index links it; where it is not, the headword still appears with its clause
# number, unlinked and muted. A reference work that hides its own scope is less
# useful than one that shows where it is going.
#
# Flags: `key` bolds the headword (the terms most people arrive looking for);
# `example` marks it with a square (an entry carrying a worked example);
# `template` marks a downloadable template; `level: entry` marks an entry-level
# explanation. The filters on the page act on these.

