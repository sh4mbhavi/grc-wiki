  # the demonstrated use of the search box. Swap them as the keyword set moves.
  chips:
    - what is GRC
    - how to learn GRC
    - ISO 27001 vs SOC 2
    - risk appetite vs tolerance
    - incident response lifecycle
  start_here:
    - 1.1
    - 1.3
    - 1.4
    - 3.1
  most_cited:
