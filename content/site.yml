# Site-wide configuration. Everything the generator needs that is not an entry.
# Both builds (tools/build.py and next/) read this file. Edit it here only.

site:
  name: GRC Wiki
  short_name: GRC Wiki
  # Change to the real hostname before launch. Used for canonicals, sitemap,
  # Open Graph and JSON-LD - a wrong value here quietly breaks all four.
  # The live hostname. Canonicals, Open Graph, the sitemap and the JSON-LD all
  # derive from it, so a wrong value here quietly breaks all four. Change this
  # one line when the custom domain is attached.
  origin: https://grc-wiki.vercel.app
  # "/" for a root domain or a Vercel deployment; "/repo/" only when serving
  # from a project-scoped GitHub Pages URL.
  base_path: /
  locale: en-GB
  description: >-
    A plain-language reference for governance, risk and compliance:
    cross-referenced entries covering what the work is, which artefact answers
    which question, and how the frameworks fit together.
  # The published count is computed from content/entries/ and used everywhere a
  # number appears. `planned` is the target corpus and is only ever shown next
  # to the real figure. Claiming a corpus you do not have is the fastest way to
  # lose the trust the whole reference is built on.
  entries_planned: 212
  parts_total: 6

# GRC Wiki is maintained by working GRC practitioners. Named training options
# are compared in entry 6.3; other entries do not name a provider.

editorial:
  standfirst: A PLAIN-LANGUAGE REFERENCE FOR PRACTITIONERS
  # Maintainer shown in the footer and the Organization schema.
  maintainer: Maintained by working governance, risk and compliance practitioners.
  # Corpus-wide review and first-publication dates. An entry's own `reviewed:`
  # front-matter overrides the review date for that entry. Used for
  # datePublished / dateModified in the structured data and the visible
  # "Reviewed" line, which is a freshness signal for search and AI answers.
  first_published: "2026-01-15"
  reviewed: "2026-02-20"

